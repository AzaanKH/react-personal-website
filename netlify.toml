[build]
  command = "npm run build"
  publish = "dist"
  functions = "netlify/functions"

[build.environment]
  NODE_VERSION = "24"

[dev]
  command = "npm run dev"
  targetPort = 3000
  port = 8888
  autoLaunch = false

# SPA routes. These are listed explicitly instead of a "/*" catch-all: under
# `netlify dev` a catch-all also captured Vite's in-memory modules
# (/src/main.jsx, /@vite/client) and returned HTML, leaving a blank page.
# Unknown paths fall through to public/404.html with a real 404 status.
[[redirects]]
  from = "/projects"
  to = "/index.html"
  status = 200

[[redirects]]
  from = "/gaming"
  to = "/index.html"
  status = 200

[[redirects]]
  from = "/contact"
  to = "/index.html"
  status = 200

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
