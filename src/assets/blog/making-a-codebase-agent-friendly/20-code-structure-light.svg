<svg xmlns="http://www.w3.org/2000/svg" class="fdv light" viewBox="0 0 1200 600" width="1200" height="600" role="img" aria-labelledby="t d"><title id="t">Where the rules live after the refactor</title><desc id="d">Five packages, web-app, server, extension, cli and scripts, each import from the shared package by exact subpath. Import counts on main: web-app uses draft 97, league 63, sync 53, catalog 23, units 11, http 4. server uses catalog 7, sync 5, league 5, node 2, draft 2, http 1. extension uses sync 8, and units, league, http and catalog 2 each, draft 1. cli uses catalog 12, league 11, draft 8, sync 7, units 3, node 1, http 1. scripts uses catalog 29, league 27, node 16, http 5, units 2, draft 2. The shared modules are draft, league, units, catalog, sync, http and node. Lint points to the owner for bare fetch, child_process, Date.now, new position lists and root imports.</desc><style>
