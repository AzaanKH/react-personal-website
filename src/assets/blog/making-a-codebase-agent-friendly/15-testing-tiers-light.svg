<defs>
<marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" class="arrowhead"/></marker>
<marker id="ah1" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" class="arrowhead-s1"/></marker>
</defs>
<rect class="bg" x="0" y="0" width="1200" height="560"/>
<text class="h1" x="32.0" y="44.0" text-anchor="start" >Tiered persistence testing</text>
<text class="b ink2" x="32.0" y="70.0" text-anchor="start" >Escalate only when a cheaper tier gives a reason to. Adopted 2026-10-22 after repeated full matrices drained usage.</text>
<path class="w-s2" d="M310.0 110L450.0 110L530.0 220L230.0 220Z"/>
<text class="b bold" x="380.0" y="168.0" text-anchor="middle" >Tier 3 · full matrix</text>
<text class="xs ink2" x="380.0" y="190.0" text-anchor="middle" >9,000 commands per scenario · about 2–3 h</text>
<path class="w-s1" d="M230.0 230L530.0 230L620.0 340L140.0 340Z"/>
<text class="b bold" x="380.0" y="288.0" text-anchor="middle" >Tier 2 · browser smoke on GPT</text>
<text class="xs ink2" x="380.0" y="310.0" text-anchor="middle" >300 commands per actor + 20 conflicts + 20 moves</text>
<path class="w-s3" d="M140.0 350L620.0 350L710.0 460L50.0 460Z"/>
<text class="b bold" x="380.0" y="408.0" text-anchor="middle" >Tier 1 · deterministic unit tests</text>
<text class="xs ink2" x="380.0" y="430.0" text-anchor="middle" >jsdom interleavings, fake-indexeddb · seconds</text>
<text class="b bold" x="760.0" y="150.0" text-anchor="start" >Runs only when one of these holds:</text>
<text class="s ink2" x="760.0" y="172.0" text-anchor="start" >a lower tier failed or flaked;</text>
<text class="s ink2" x="760.0" y="191.0" text-anchor="start" >the PR changes the ack, transaction or write path;</text>
<text class="s ink2" x="760.0" y="210.0" text-anchor="start" >the root needs it before a production flip.</text>
<text class="b bold" x="760.0" y="270.0" text-anchor="start" >Once per PR that touches persistence.</text>
<text class="s ink2" x="760.0" y="292.0" text-anchor="start" >Scoped to the scenarios the PR affects.</text>
<text class="b bold" x="760.0" y="390.0" text-anchor="start" >On every commit, inside pnpm verify.</text>
<text class="s ink2" x="760.0" y="412.0" text-anchor="start" >Every stress failure is first reproduced here,</text>
<text class="s ink2" x="760.0" y="431.0" text-anchor="start" >as a test that fails before the fix.</text>
<text class="xs muted" x="32.0" y="542.0" text-anchor="start" >Flip PR #117: Tier 3 caught a startup overwrite bug and the final review caught a retry dead end. Both were fixed test-first; Tier 3 then kept 9,000/9,000.</text></svg>
