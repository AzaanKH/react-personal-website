<svg xmlns="http://www.w3.org/2000/svg" class="fdv dark" viewBox="0 0 1200 700" width="1200" height="700" role="img" aria-labelledby="t d"><title id="t">Agent role topology</title><desc id="d">Operator, root orchestrator, owners, verifiers and browser runners, with the messages between them.</desc>
<style>
svg.fdv{--bg:#fcfcfb;--panel:#f3f2ee;--ink:#0b0b0b;--ink2:#52514e;--muted:#6f6d68;--grid:#e1e0d9;--axis:#c3c2b7;
--line:#8a8882;--s1:#2a78d6;--s1w:rgba(42,120,214,.12);--s2:#eb6834;--s2w:rgba(235,104,52,.12);--s3:#1baf7a;--s3w:rgba(27,175,122,.14);
--good:#0b7d0b;--goodw:rgba(12,163,12,.12);--bad:#c43333;--badw:rgba(208,59,59,.11);--warn:#9a6a00;--warnw:rgba(250,178,25,.18);
--box:#ffffff;--border:rgba(11,11,11,.16)}
@media (prefers-color-scheme: dark){svg.fdv:not(.light){--bg:#1a1a19;--panel:#232321;--ink:#f0efec;--ink2:#c3c2b7;--muted:#9a9890;--grid:#2c2c2a;--axis:#383835;
--line:#7d7b74;--s1:#3987e5;--s1w:rgba(57,135,229,.18);--s2:#d95926;--s2w:rgba(217,89,38,.2);--s3:#199e70;--s3w:rgba(25,158,112,.2);
--good:#3fbf3f;--goodw:rgba(12,163,12,.2);--bad:#ef6b6b;--badw:rgba(208,59,59,.22);--warn:#fab219;--warnw:rgba(250,178,25,.16);
--box:#262624;--border:rgba(255,255,255,.14)}}
svg.fdv.dark{--bg:#1a1a19;--panel:#232321;--ink:#f0efec;--ink2:#c3c2b7;--muted:#9a9890;--grid:#2c2c2a;--axis:#383835;
--line:#7d7b74;--s1:#3987e5;--s1w:rgba(57,135,229,.18);--s2:#d95926;--s2w:rgba(217,89,38,.2);--s3:#199e70;--s3w:rgba(25,158,112,.2);
--good:#3fbf3f;--goodw:rgba(12,163,12,.2);--bad:#ef6b6b;--badw:rgba(208,59,59,.22);--warn:#fab219;--warnw:rgba(250,178,25,.16);
--box:#262624;--border:rgba(255,255,255,.14)}
svg.fdv text{font-family:system-ui,-apple-system,"Segoe UI",sans-serif;fill:var(--ink)}
svg.fdv .mono{font-family:ui-monospace,SFMono-Regular,Menlo,monospace}
svg.fdv .bg{fill:var(--bg)}
svg.fdv .panel{fill:var(--panel)}
svg.fdv .box{fill:var(--box);stroke:var(--border);stroke-width:1}
svg.fdv .ink2{fill:var(--ink2)}
svg.fdv .muted{fill:var(--muted)}
svg.fdv .h1{font-size:22px;font-weight:650}
svg.fdv .h2{font-size:16px;font-weight:650}
svg.fdv .b{font-size:14px}
svg.fdv .s{font-size:12.5px}
svg.fdv .xs{font-size:11.5px}
svg.fdv .bold{font-weight:650}
svg.fdv .grid{stroke:var(--grid);stroke-width:1}
svg.fdv .axis{stroke:var(--axis);stroke-width:1}
svg.fdv .edge{stroke:var(--line);stroke-width:1.5;fill:none}
svg.fdv .edge-s1{stroke:var(--s1);stroke-width:2;fill:none}
svg.fdv .arrowhead{fill:var(--line)}
svg.fdv .arrowhead-s1{fill:var(--s1)}
svg.fdv .f-s1{fill:var(--s1)} svg.fdv .f-s2{fill:var(--s2)} svg.fdv .f-s3{fill:var(--s3)}
svg.fdv .w-s1{fill:var(--s1w);stroke:var(--s1);stroke-width:1.5}
svg.fdv .w-s2{fill:var(--s2w);stroke:var(--s2);stroke-width:1.5}
svg.fdv .w-s3{fill:var(--s3w);stroke:var(--s3);stroke-width:1.5}
svg.fdv .w-good{fill:var(--goodw);stroke:var(--good);stroke-width:1.2}
svg.fdv .w-bad{fill:var(--badw);stroke:var(--bad);stroke-width:1.2}
svg.fdv .w-warn{fill:var(--warnw);stroke:var(--warn);stroke-width:1.2}
svg.fdv .t-good{fill:var(--good);font-weight:700} svg.fdv .t-bad{fill:var(--bad);font-weight:700} svg.fdv .t-warn{fill:var(--warn);font-weight:700}
svg.fdv .l-s1{stroke:var(--s1);stroke-width:2;fill:none;stroke-linecap:round;stroke-linejoin:round}
svg.fdv .l-muted{stroke:var(--muted);stroke-width:2;fill:none;stroke-linecap:round}
svg.fdv .l-bad{stroke:var(--bad);stroke-width:1.5;fill:none}
