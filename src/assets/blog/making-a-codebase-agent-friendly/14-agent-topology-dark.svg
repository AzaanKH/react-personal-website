</style>
<defs>
<marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" class="arrowhead"/></marker>
<marker id="ah1" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" class="arrowhead-s1"/></marker>
</defs>
<rect class="bg" x="0" y="0" width="1200" height="700"/>
<text class="h1" x="32.0" y="44.0" text-anchor="start" >Who did what</text>
<text class="b ink2" x="32.0" y="70.0" text-anchor="start" >One root wrote the stack topology. Owners built one unit each. Verifiers only read. Browser work ran on GPT.</text>
<rect class="w-s3" x="440.0" y="96.0" width="320.0" height="92.0" rx="10"></rect>
<text class="b bold" x="456.0" y="124.0" text-anchor="start" >Operator (Azaan)</text>
<text class="s ink2" x="456.0" y="146.0" text-anchor="start" >Approves the plan and makes product calls.</text>
<text class="s ink2" x="456.0" y="164.0" text-anchor="start" >Lands the stack.</text>
<rect class="w-s1" x="400.0" y="240.0" width="400.0" height="112.0" rx="10"></rect>
<text class="b bold" x="416.0" y="268.0" text-anchor="start" >Root orchestrator (Claude)</text>
<text class="s ink2" x="416.0" y="290.0" text-anchor="start" >Single writer of the stack topology.</text>
<text class="s ink2" x="416.0" y="308.0" text-anchor="start" >Writes briefs, posts one verdict per PR,</text>
<text class="s ink2" x="416.0" y="326.0" text-anchor="start" >logs every decision to decisions.tsv.</text>
<rect class="box" x="40.0" y="420.0" width="330.0" height="150.0" rx="10"></rect>
<text class="b bold" x="56.0" y="448.0" text-anchor="start" >Unit owners</text>
<text class="s ink2" x="56.0" y="470.0" text-anchor="start" >Codex gpt-6.1-sol, high effort.</text>
<text class="s ink2" x="56.0" y="488.0" text-anchor="start" >Opus owners for UI units and when</text>
<text class="s ink2" x="56.0" y="506.0" text-anchor="start" >Codex hit its limit.</text>
<text class="s ink2" x="56.0" y="524.0" text-anchor="start" >One worktree, one branch, one PR.</text>
<text class="s ink2" x="56.0" y="542.0" text-anchor="start" >Report once: STACK-READY.</text>
<rect class="box" x="435.0" y="420.0" width="330.0" height="150.0" rx="10"></rect>
<text class="b bold" x="451.0" y="448.0" text-anchor="start" >Verifiers (read-only)</text>
<text class="s ink2" x="451.0" y="470.0" text-anchor="start" >Sonnet: code, diff and byte checks.</text>
<text class="s ink2" x="451.0" y="488.0" text-anchor="start" >Codex: default reviewer after 10-25.</text>
<text class="s ink2" x="451.0" y="506.0" text-anchor="start" >One review round unless it finds</text>
<text class="s ink2" x="451.0" y="524.0" text-anchor="start" >a blocker.</text>
<rect class="box" x="830.0" y="420.0" width="330.0" height="150.0" rx="10"></rect>
<text class="b bold" x="846.0" y="448.0" text-anchor="start" >Browser runners (GPT)</text>
<text class="s ink2" x="846.0" y="470.0" text-anchor="start" >Codex GPT for every browser task:</text>
<text class="s ink2" x="846.0" y="488.0" text-anchor="start" >Playwright stress matrices, Tier 2</text>
<text class="s ink2" x="846.0" y="506.0" text-anchor="start" >smokes, pixel checks, the UI</text>
<text class="s ink2" x="846.0" y="524.0" text-anchor="start" >screenshot walkthrough.</text>
<path class="edge" d="M600 188L600 236" marker-end="url(#ah)"/>
<text class="xs ink2" x="612.0" y="218.0" text-anchor="start" >approval, decisions</text>
<path class="edge" d="M440 352C300 380 220 380 205 416" marker-end="url(#ah)"/>
<text class="xs ink2" x="236.0" y="372.0" text-anchor="start" >brief + base SHA</text>
<path class="edge" d="M600 352L600 416" marker-end="url(#ah)"/>
<text class="xs ink2" x="612.0" y="392.0" text-anchor="start" >verify PR</text>
<path class="edge" d="M760 352C900 380 980 380 995 416" marker-end="url(#ah)"/>
<text class="xs ink2" x="860.0" y="372.0" text-anchor="start" >authorize one run</text>
<rect class="panel" x="40.0" y="610.0" width="1120.0" height="54.0" rx="10"></rect>
<text class="s" x="60.0" y="642.0" text-anchor="start" >GitHub stack: #76 → #77 → … → #119. Owners force-push only their own branch. The root restacks and retargets. The operator merges.</text>
<text class="xs muted" x="32.0" y="682.0" text-anchor="start" >Planning used the same split: 5 evidence miners and 3 code explorers, an Opus vs GPT architect arena, and a GPT cross-judge.</text></svg>
