<svg xmlns="http://www.w3.org/2000/svg" class="fdv light" viewBox="0 0 1200 444" width="1200" height="444" role="img" aria-labelledby="t d"><title id="t">Three review rounds on the UI fix branch</title><desc id="d">Three columns. Round 1 on 9166c41: CHANGES, finding S1, the Available next pick header overflowed its phone column; fix 2c8943f. Round 2 on 2c8943f: CHANGES, S1 resolved, finding S2, long names clamped at two lines; fix 101653c. Round 3 on 101653c: APPROVE, 0 of 437 names truncated and all headers fit.</desc>
<style>
